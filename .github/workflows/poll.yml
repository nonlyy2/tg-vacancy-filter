name: poll

on:
  schedule:
    # Every 30 minutes, deliberately off the hour. GitHub's scheduler is
    # busiest at :00 and :30 and quietly drops runs queued there — three
    # slots in a row were skipped on "*/30". Odd minutes get served.
    # Still best-effort: the cursor in state.json makes a skipped run harmless.
    - cron: "7,37 * * * *"
  workflow_dispatch:

# Only schedule and manual triggers: a pull_request trigger would expose the
# Telegram session secret to anyone who opens a PR against this public repo.
permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # 18m poll + build, plus headroom for the re-arm floor.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Record start time
        id: started
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -o bot .

      - name: Poll channels
        id: poll
        env:
          TG_APP_ID: ${{ secrets.TG_APP_ID }}
          TG_APP_HASH: ${{ secrets.TG_APP_HASH }}
          TG_PHONE: ${{ secrets.TG_PHONE }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOURCE_CHANNEL_IDS: ${{ secrets.SOURCE_CHANNEL_IDS }}
          DESTINATION: ${{ secrets.DESTINATION }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK }}
          MATCH_THRESHOLD: ${{ vars.MATCH_THRESHOLD }}
          # First run of a channel sweeps back to this date; afterwards the
          # cursor in state.json takes over.
          POLL_BOOTSTRAP_SINCE: "2026-08-24"
          # Stay well inside timeout-minutes. A long backlog is consumed
          # across several scheduled runs instead of one oversized job.
          POLL_MAX_RUNTIME: "18m"
          # matches.jsonl holds the full text of source posts — keep it out of
          # a public repository.
          MATCH_LOG_PATH: ""
          LOG_LEVEL: info
        run: ./bot --once

      - name: Persist poll cursor
        id: persist
        # Runs even when the poll step failed: partial progress is still worth
        # keeping, and the commit is what keeps the schedule from being
        # disabled after 60 days of repository inactivity.
        if: always()
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update poll cursor"
          git pull --rebase --autostash
          git push

      - name: Re-arm the next run
        # GitHub's schedule trigger proved unreliable on this repository, so a
        # run queues its own successor. GITHUB_TOKEN cannot do this — GitHub
        # blocks it from triggering workflows to prevent recursion — hence a
        # PAT. Without the secret this is a no-op and the schedule is the only
        # trigger left.
        #
        # Guarded twice against a runaway loop: skipped when the poll step
        # never ran (a broken build must stop the chain, not spin on it), and
        # floored to a minimum cycle so a fast-failing poll cannot re-arm more
        # than a few times an hour.
        if: always() && steps.poll.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          MIN_CYCLE_SECONDS: "600"
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DISPATCH_TOKEN not set — relying on the schedule trigger only"
            exit 0
          fi
          elapsed=$(( $(date +%s) - ${{ steps.started.outputs.at }} ))
          if [ "$elapsed" -lt "$MIN_CYCLE_SECONDS" ]; then
            wait=$(( MIN_CYCLE_SECONDS - elapsed ))
            echo "run took ${elapsed}s; waiting ${wait}s to keep the cycle sane"
            sleep "$wait"
          fi
          gh workflow run poll.yml --repo "$GITHUB_REPOSITORY"
          echo "next run queued"
